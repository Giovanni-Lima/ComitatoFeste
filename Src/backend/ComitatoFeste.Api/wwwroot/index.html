<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comitato feste 87 — Agenda</title>
  <style>
    :root{
      /* palette dalla maglietta del comitato: giallo, sole arancio, triangolo rosa→viola */
      --bg:#f4f2e8; --card:#ffffff; --line:#e3ddca; --cardline:#e9e3d1;
      --ink:#2b2420; --ink-soft:#4b423b; --muted:#9b9282;
      --accent:#7c3aed; --yellow:#f2e11c;
      --decisione:#7c3aed; --domanda:#e23b8c; --media:#e0820c; --info:#8b7fae;
    }
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;background:var(--bg);color:var(--ink);
      font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    a{color:var(--accent)}

    /* --- shell: sidebar fissa + area principale ---------------------------- */
    .app{display:flex;align-items:flex-start;min-height:100vh}

    .sidebar{width:250px;flex:none;background:#fff;border-right:1px solid var(--line);
      position:sticky;top:0;height:100vh;overflow-y:auto;
      padding:0 16px 18px;display:flex;flex-direction:column;gap:18px}
    .brand{font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;
      height:70px;margin:0 -16px;padding:0 16px;border-bottom:2px solid var(--yellow)}
    .me{position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--bg)}
    .me:empty{display:none}
    .me:not(:empty){cursor:pointer}
    /* badge profilo nella riga del menu (solo mobile, vedi @media) */
    #meSide{display:none;padding:4px 10px 4px 4px;gap:8px;background:#fff;border:1px solid var(--line)}
    #meSide .me-av{width:28px;height:28px}
    #meSide .me-name{font-weight:600;font-size:13px}
    .me-av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:#cfd8dc}
    .me-av.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px}
    .me-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* --- menu a comparsa (esci) dal badge utente --------------------------- */
    .me-menu{position:absolute;top:calc(100% + 6px);right:0;z-index:20;background:#fff;
      border:1px solid var(--cardline);border-radius:10px;box-shadow:0 4px 16px rgba(38,50,56,.16);padding:5px;
      min-width:100px;opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .15s,transform .15s}
    .me.open .me-menu{opacity:1;pointer-events:auto;transform:none}
    .me-menu .logout{display:block;width:100%;border:0;border-radius:6px;padding:7px 10px;text-align:left;
      background:none;font:inherit;font-size:12px;color:var(--ink-soft);cursor:pointer}
    .me-menu .logout:hover{background:var(--bg)}

    /* --- sidebar: menu di navigazione ------------------------------------- */
    .side-nav{display:flex;flex-direction:column;gap:3px}
    .navitem{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border:0;border-radius:9px;
      background:none;text-align:left;font:inherit;font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer}
    .navitem:hover{background:var(--bg)}
    .navitem.active{background:var(--accent);color:#fff}
    .navitem svg{width:17px;height:17px;flex:none}

    /* --- navigazione data (in topbar) ----------------------------------- */
    .daynav{display:flex;align-items:center;gap:6px}
    .daynav button{width:28px;height:28px;flex:none;border:1px solid var(--line);background:#fff;border-radius:8px;
      font-size:15px;line-height:1;cursor:pointer;color:var(--ink-soft)}
    .daynav button:hover{background:var(--bg)}
    .daynav input{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;background:#fff}

    /* --- barra filtri per tipo (sopra la timeline) ---------------------- */
    .typebar{margin-bottom:16px}
    .filters{display:flex;flex-wrap:wrap;gap:8px}
    .fitem{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid var(--line);
      border-radius:999px;background:#fff;font:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer}
    .fitem:hover{background:var(--bg)}
    .fitem .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
    .fitem.active{background:var(--c);color:#fff;border-color:var(--c)}
    .fitem.active .dot{background:#fff}

    .main{flex:1;min-width:0;display:flex;flex-direction:column}
    .topbar{position:sticky;top:0;z-index:10;background:var(--yellow);
      border-bottom:2px solid color-mix(in srgb, var(--yellow) 72%, #7a6b00);
      min-height:70px;padding:8px 24px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
    .topbar h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.01em}
    .topbar .me.sm{margin-left:auto;padding:4px 12px 4px 4px;gap:8px;background:#fff}
    .topbar .me.sm .me-av{width:28px;height:28px}
    .topbar .me.sm .me-name{font-weight:600}

    .view{flex:1;width:100%;max-width:1320px;margin:0 auto;padding:22px 20px 90px}
    .content{display:grid;gap:22px;align-items:start;grid-template-columns:1fr 210px;grid-template-areas:"timeline stats"}
    .timeline{grid-area:timeline;min-width:0}

    .stats{grid-area:stats;position:sticky;top:96px;display:flex;flex-direction:column;gap:14px}
    .stat{background:var(--yellow);
      border:1px solid color-mix(in srgb, var(--yellow) 72%, #7a6b00);border-radius:12px;padding:16px 18px 18px}
    .stat .k{font-size:12px;font-weight:700;color:var(--ink)}
    .stat .s{font-size:11px;color:var(--ink-soft);margin-top:1px}
    .stat .v{margin-top:16px;font-size:26px;font-weight:700;color:var(--ink);line-height:1}

    @media (max-width:1080px){
      .content{grid-template-columns:1fr;grid-template-areas:"stats" "timeline"}
      .stats{flex-direction:row;position:static}
      .stat{flex:1}
      .stat .v{margin-top:12px;font-size:22px}
      .sidebar{width:200px}
      .mgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
    }
    /* mobile in landscape: stessa fascia di larghezza del tablet portrait, ma tile più piccole */
    @media (max-width:1080px) and (orientation:landscape){
      .mgrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
    }
    @media (max-width:820px){
      .app{flex-direction:column;align-items:stretch}
      /* la sidebar diventa una fascia in cima: brand + menu + badge utente su una riga */
      .sidebar{width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);
        flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;overflow:visible}
      .brand{border-bottom:0;height:auto;margin:0 auto 0 0;padding:0;font-size:18px;display:block}
      .side-nav{order:3;flex-basis:100%;flex-direction:row;justify-content:flex-start;align-items:center;gap:6px}
      .navitem{width:auto}
      #meSide:not(:empty){display:flex;margin-left:auto}

      .topbar{min-height:55px;padding:8px 16px}
      .topbar .me.sm{display:none}
      .view{padding:16px 12px 80px}
      .day{scroll-margin-top:64px}
      .content{grid-template-columns:1fr;grid-template-areas:"timeline"}
      .stats{display:none}
      /* 5 chip (Agenda): 3 sulla prima riga, 2 sulla seconda, entrambe centrate */
      .typebar .filters{justify-content:center}
      .typebar .fitem{width:calc(33.333% - 6px);justify-content:center;padding:7px 4px}
      /* 4 chip (Media): tutte sulla stessa riga */
      #mediaFilters .fitem{width:calc(25% - 6px);justify-content:center;padding:7px 2px}
    }

    .day{margin:0 auto 14px;border:1px solid var(--line);border-radius:12px;background:#fff;
      overflow:hidden;scroll-margin-top:88px}
    .day-head{width:100%;display:flex;align-items:center;gap:12px;padding:14px 18px;
      cursor:pointer;color:var(--ink)}
    .day-head:hover{background:var(--bg)}
    .day-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
    .day-title{font-weight:700;text-transform:capitalize}
    .day.today .day-title::after{content:"oggi";margin-left:8px;padding:1px 7px;border-radius:9px;
      background:var(--accent);color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;vertical-align:1px}
    .day-count{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
    .day-dl{flex:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center;
      border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink-soft);cursor:pointer}
    .day-dl:hover{background:var(--bg)}
    .day-dl svg{width:16px;height:16px}
    .day-dl.busy{pointer-events:none}
    .day-dl.busy svg{display:none}
    .day-dl.busy::after{content:"";width:14px;height:14px;border:2px solid var(--line);
      border-top-color:var(--ink-soft);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .chev{color:var(--muted);font-size:12px;line-height:1;transition:transform .15s}
    .day.open .chev{transform:rotate(90deg)}
    .day-body{display:none;padding:22px 12px 26px;border-top:1px solid var(--line)}
    .day.open .day-body{display:block}

    .empty,.loading,.error{text-align:center;color:var(--muted);padding:40px 20px}
    .error{color:#c62828}

    .rail{position:relative;max-width:1000px;margin:0 auto}
    .rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-50%)}

    .row{position:relative;display:flex;align-items:flex-start}
    .row.left{justify-content:flex-start}
    .row.right{justify-content:flex-end}
    /* le righe si alternano su lati opposti: le stringo lasciando invariata
       la spaziatura minima fra i badge (>= altezza card precedente - 38px) */
    .row + .row{margin-top:-38px}

    .card{position:relative;width:calc(50% - 34px);margin-bottom:8px;background:var(--card);
      border:1px solid var(--cardline);border-radius:9px;padding:13px 15px;box-shadow:0 1px 3px rgba(38,50,56,.08)}
    /* punta con bordino: ::before = bordo, ::after = riempimento (1px più interno) */
    .row .card::before{content:"";position:absolute;top:22px;border:10px solid transparent}
    .row .card::after {content:"";position:absolute;top:23px;border:9px solid transparent}
    .row.left  .card::before{right:-20px;border-left-color:var(--cardline)}
    .row.left  .card::after {right:-18px;border-left-color:var(--card)}
    .row.right .card::before{left:-20px;border-right-color:var(--cardline)}
    .row.right .card::after {left:-18px;border-right-color:var(--card)}

    .badge{position:absolute;left:50%;top:14px;transform:translateX(-50%);
      width:38px;height:38px;border-radius:50%;display:flex;z-index:2;
      align-items:center;justify-content:center;color:#fff;box-shadow:0 0 0 4px var(--bg)}
    .badge svg{width:19px;height:19px}

    .tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
      padding:2px 8px;border-radius:10px;margin-bottom:7px}

    .card-head{display:flex;align-items:center;gap:10px;margin-bottom:7px}
    .avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;background:#cfd8dc}
    .avatar.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
    .name{font-weight:700;color:var(--ink)}
    .time{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
    .text{color:var(--ink-soft)}

    .media{margin-top:10px}
    .media img{max-width:100%;max-height:320px;border-radius:6px;border:1px solid #e0e0e0;display:block}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
    .gallery a{display:block;line-height:0}
    .gallery img{width:100%;height:92px;object-fit:cover;border-radius:6px;border:1px solid #e0e0e0}
    .media video{width:100%;max-height:320px;border-radius:6px;border:1px solid #e0e0e0;display:block;background:#000}
    .media audio{width:100%;height:36px}
    .media .doc{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;background:var(--bg);
      border-radius:6px;text-decoration:none;font-size:13px;line-height:1.3;word-break:break-all}
    .media .doc svg{width:22px;height:22px;flex:none;color:var(--media)}
    .media.doclist{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
    .media.muted{color:var(--muted);font-style:italic;font-size:13px}

    /* --- vista Media: gruppi per giorno + griglia di tile --------------- */
    .mgroup{margin:0 auto 14px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
    .mgroup-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
    .mgroup-title{font-weight:700;text-transform:capitalize}
    .mgroup.today .mgroup-title::after{content:"oggi";margin-left:8px;padding:1px 7px;border-radius:9px;
      background:var(--accent);color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;vertical-align:1px}
    .mgroup-count{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
    .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;padding:14px}
    .mtile{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--bg);
      border:1px solid var(--cardline);display:block;color:inherit;text-decoration:none}
    .mtile img,.mtile video,.mtile canvas{width:100%;height:100%;object-fit:cover;display:block;background:#000}
    .mtile canvas.mpdf{position:absolute;inset:0;background:transparent}
    .mtile .micon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--media)}
    .mtile .micon svg{width:32px;height:32px}
    .mtile .mplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .mtile .mplay span{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);
      display:flex;align-items:center;justify-content:center;color:#fff}
    .mtile .msize{position:absolute;top:5px;right:6px;padding:1px 6px;border-radius:6px;
      background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:600}
    .mtile .mcap{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;
      background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff;font-size:10px;line-height:1.3;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media (max-width:680px){
      .mgrid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
    }


    .login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
      background:var(--bg);padding:20px}
    .login[hidden]{display:none}
    .login-box{background:#fff;border:1px solid var(--cardline);border-radius:12px;
      box-shadow:0 2px 12px rgba(38,50,56,.12);padding:26px 24px;width:100%;max-width:340px;
      display:flex;flex-direction:column;gap:12px}
    .login-box h2{margin:0;font-size:17px}
    .login-box p{margin:0;color:var(--muted);font-size:13px}
    .login-box label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-soft)}
    .login-box input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-weight:400}
    .login-box button{margin-top:4px;border:0;border-radius:8px;padding:9px;background:var(--accent);
      color:#fff;font:inherit;font-weight:700;cursor:pointer}
    .login-box button:disabled{opacity:.5;cursor:default}
    .login-err{color:#c62828;font-size:12px}

    .to-top{position:fixed;right:18px;bottom:18px;z-index:50;width:42px;height:42px;border-radius:50%;
      border:1px solid color-mix(in srgb, var(--yellow) 72%, #7a6b00);background:var(--yellow);color:var(--ink);cursor:pointer;
      display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(38,50,56,.18);
      opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .18s,transform .18s}
    .to-top.show{opacity:1;pointer-events:auto;transform:none}
    .to-top svg{width:20px;height:20px}

    @media (max-width:680px){
      .rail::before{left:19px}
      .row,.row.left,.row.right{justify-content:flex-start}
      /* colonna unica: annulla il margine negativo pensato per le righe alternate */
      .row + .row{margin-top:10px}
      .card{width:calc(100% - 44px);margin-left:44px}
      .row .card::before,.row .card::after{display:none}
      .badge{left:19px;transform:translateX(-50%)}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">Comitato feste 87</div>
      <div class="me sm" id="meSide"></div>
      <nav class="side-nav" id="nav">
        <button class="navitem active" data-view="agenda" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
          Agenda
        </button>
        <button class="navitem" data-view="media" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="15" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5L7 21"/></svg>
          Media
        </button>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar" id="topbar">
        <h1 id="viewTitle">Agenda</h1>
        <div class="daynav" id="daynav">
          <button id="prev" title="Giorno precedente">‹</button>
          <input type="date" id="day">
          <button id="next" title="Giorno successivo">›</button>
        </div>
        <div class="me sm" id="meTop"></div>
      </header>

      <section class="view" id="viewAgenda">
        <div class="typebar"><div class="filters" id="filters"></div></div>
        <div class="content">
          <main class="timeline" id="timeline"></main>
          <aside class="stats" id="stats"></aside>
        </div>
      </section>

      <section class="view" id="viewMedia" hidden>
        <div class="typebar"><div class="filters" id="mediaFilters"></div></div>
        <div id="mediaGrid"></div>
      </section>
    </div>
  </div>

  <div id="login" class="login" hidden>
    <form class="login-box" id="loginForm">
      <h2>Comitato feste 87</h2>
      <p>Accesso riservato ai membri del gruppo.</p>
      <label>Utente <input id="lgUser" autocomplete="username" placeholder="es. e.caniglia" autocapitalize="none" spellcheck="false"></label>
      <label>Password <input id="lgPass" type="password" autocomplete="current-password"></label>
      <div class="login-err" id="lgErr" hidden></div>
      <button type="submit" id="lgBtn">Entra</button>
    </form>
  </div>

  <button id="toTop" class="to-top" aria-label="Torna su" title="Torna su">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
  </button>

  <script>
    const qs = new URLSearchParams(location.search);
    // Default: stessa origine da cui è servita la pagina (in produzione l'API serve anche
    // questo file). Override con ?api=http://host:porta per puntare a un'API separata.
    const API = (qs.get("api") || "").replace(/\/$/, "");

    // --- auth ---------------------------------------------------------------
    const TOKEN_KEY = "cf87_token", USER_KEY = "cf87_user";
    let token = null;
    try { token = localStorage.getItem(TOKEN_KEY); } catch (e) { /* private mode */ }

    const authHeaders = () => token ? { Authorization: `Bearer ${token}` } : {};

    function setToken(t){
      token = t;
      try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    }
    function currentUser(){
      try { return JSON.parse(localStorage.getItem(USER_KEY) || "null"); } catch (e) { return null; }
    }
    function setUser(u){
      try { u ? localStorage.setItem(USER_KEY, JSON.stringify(u)) : localStorage.removeItem(USER_KEY); } catch (e) {}
    }
    function showLogin(){ el("login").hidden = false; el("lgUser").focus(); }
    function hideLogin(){ el("login").hidden = true; renderMe(); }
    function logout(){ setToken(null); setUser(null); location.reload(); }

    // Avatar + nome nel pannello laterale e nella topbar; l'immagine sostituisce
    // il placeholder a iniziali solo se il membro ha davvero una foto (onload). Il badge
    // include un menu a comparsa (click per aprirlo/chiuderlo) con la sola voce "esci".
    function renderMe(){
      const u = currentUser();
      for (const [id, greet] of [["meTop", true], ["meSide", true]]) {
        const box = el(id);
        if (!box) continue;
        box.classList.remove("open");
        if (!u) { box.innerHTML = ""; continue; }
        const label = greet ? `Ciao ${esc(u.displayName.split(" ")[0])}` : esc(u.displayName);
        box.innerHTML =
          `<div class="me-av ph" style="background:hsl(${hue(u.displayName)} 42% 55%)">${esc(initials(u.displayName))}</div>` +
          `<span class="me-name">${label}</span>` +
          `<div class="me-menu"><button type="button" class="logout">esci</button></div>`;
        const img = new Image();
        img.className = "me-av";
        img.alt = "";
        img.onload = () => { const ph = box.querySelector(".me-av.ph"); if (ph) box.replaceChild(img, ph); };
        img.src = `${API}/api/members/${u.memberId}/photo`;
      }
    }

    // Click sul badge = apri/chiudi il menu; click sulla voce "esci" = logout;
    // click altrove = chiudi eventuali menu aperti.
    document.addEventListener("click", (e) => {
      const exitBtn = e.target.closest(".me-menu .logout");
      if (exitBtn) { logout(); return; }
      const box = e.target.closest(".me");
      const wasOpen = box && box.classList.contains("open");
      document.querySelectorAll(".me.open").forEach(b => b.classList.remove("open"));
      if (box && !wasOpen) box.classList.add("open");
    });

    const TYPES = {
      decisione: { color: "var(--decisione)" },
      domanda:   { color: "var(--domanda)" },
      media:     { color: "var(--media)" },
      info:      { color: "var(--info)" },
    };

    const I = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    const ICONS = {
      decisione: I(`<path d="M20 6 9 17l-5-5"/>`),
      domanda:   I(`<path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>`),
      info:      I(`<path d="M12 10v6"/><path d="M12 7h.01"/>`),
      media:     I(`<path d="M21.44 11.05 12.7 19.8a5 5 0 0 1-7.07-7.07l8.49-8.49a3.5 3.5 0 0 1 4.95 4.95l-8.49 8.49a2 2 0 0 1-2.83-2.83l7.78-7.78"/>`),
      foto:      I(`<rect x="3" y="4" width="18" height="15" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5L7 21"/>`),
      audio:     I(`<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>`),
      video:     I(`<path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/>`),
      documento: I(`<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>`),
      download:  I(`<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>`),
      play:      `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`,
    };
    function iconFor(p){
      if (p.type === "media") {
        const ct = (p.media && p.media.contentType) || "";
        if (ct.startsWith("video/")) return ICONS.video;
        return ICONS[p.media && p.media.mediaType] || ICONS.media;
      }
      return ICONS[p.type] || ICONS.info;
    }

    const el = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
    const initials = (n) => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
    const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
    const fmtTime = (iso) => new Date(iso).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Rome" });
    const fmtDay = (d) => new Date(d + "T12:00:00").toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

    let data = [];
    let filterType = null;   // null = mostra tutti i tipi

    const TYPE_LABELS = { decisione: "Decisioni", domanda: "Domande", media: "Media", info: "Info" };

    function buildFilters(){
      const item = (k, c, label) =>
        `<button class="fitem" data-k="${k}" style="--c:${c}"><span class="dot"></span>${label}</button>`;
      el("filters").innerHTML =
        item("", "var(--accent)", "Tutti") +
        Object.keys(TYPES).map(k => item(k, TYPES[k].color, TYPE_LABELS[k])).join("");
      syncChips();
    }

    function syncChips(){
      for (const b of el("filters").children)
        b.classList.toggle("active", b.dataset.k === (filterType || ""));
    }

    const avatarHtml = (p) => p.authorPhotoUrl
      ? `<img class="avatar" loading="lazy" src="${API}${p.authorPhotoUrl}" alt="">`
      : `<div class="avatar ph" style="background:hsl(${hue(p.author)} 42% 55%)">${esc(initials(p.author))}</div>`;

    const isImage = (p) => p.media && p.media.contentUrl &&
      ((p.media.contentType || "").startsWith("image/") || p.media.mediaType === "foto");

    // "documento": media scaricato che non è immagine, video o audio (PDF e simili).
    const isDoc = (p) => {
      if (!p.media || !p.media.contentUrl) return false;
      const ct = p.media.contentType || "";
      return !ct.startsWith("image/") && p.media.mediaType !== "foto"
          && !ct.startsWith("video/")
          && !ct.startsWith("audio/") && p.media.mediaType !== "audio";
    };

    // Accorpa i media consecutivi dello stesso autore arrivati nello stesso minuto
    // (i burst di WhatsApp): immagini -> { photoGroup }, documenti/PDF -> { docGroup }.
    function groupMedia(pts){
      const out = [];
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const same = isImage(p) ? isImage : isDoc(p) ? isDoc : null;
        if (!same) { out.push(p); continue; }
        const minute = fmtTime(p.occurredAt);
        const grp = [p];
        while (i + 1 < pts.length && same(pts[i + 1])
               && pts[i + 1].author === p.author
               && fmtTime(pts[i + 1].occurredAt) === minute) {
          grp.push(pts[++i]);
        }
        if (grp.length > 1) out.push(same === isImage ? { photoGroup: grp } : { docGroup: grp });
        else out.push(p);
      }
      return out;
    }

    const GENERIC_CAPTION = /^(foto|immagine|video|sticker|gif|documento|file|pdf)\b.*condivis/i;

    function photoGroupHtml(grp, i){
      const p0 = grp[0];
      const c = (TYPES.media || TYPES.info).color;
      const side = i % 2 ? "right" : "left";
      const thumbs = grp.map(p => {
        const url = `${API}${p.media.contentUrl}`;
        return `<a href="${url}" target="_blank" rel="noopener"><img loading="lazy" src="${url}" alt="${esc(p.media.fileName)}"></a>`;
      }).join("");
      const caps = [...new Set(grp.map(p => p.text).filter(t => t && !GENERIC_CAPTION.test(t)))];
      const textHtml = caps.length ? caps.map(esc).join("<br>") : `${grp.length} immagini`;
      return `
        <div class="row ${side}">
          <div class="badge" style="background:${c}">${ICONS.foto}</div>
          <div class="card">
            <span class="tag" style="background:color-mix(in srgb, ${c} 14%, #fff);color:${c}">media</span>
            <div class="card-head">
              ${avatarHtml(p0)}
              <span class="name">${esc(p0.author)}</span>
              <span class="time">${fmtTime(p0.occurredAt)}</span>
            </div>
            <div class="text">${textHtml}</div>
            <div class="media"><div class="gallery">${thumbs}</div></div>
          </div>
        </div>`;
    }

    function docGroupHtml(grp, i){
      const p0 = grp[0];
      const c = (TYPES.media || TYPES.info).color;
      const side = i % 2 ? "right" : "left";
      const links = grp.map(p => {
        const url = `${API}${p.media.contentUrl}`;
        return `<a class="doc" href="${url}" target="_blank" rel="noopener">${ICONS.documento} ${esc(p.media.fileName)}</a>`;
      }).join("");
      const caps = [...new Set(grp.map(p => p.text).filter(t => t && !GENERIC_CAPTION.test(t)))];
      const textHtml = caps.length ? caps.map(esc).join("<br>") : `${grp.length} documenti`;
      return `
        <div class="row ${side}">
          <div class="badge" style="background:${c}">${ICONS.documento}</div>
          <div class="card">
            <span class="tag" style="background:color-mix(in srgb, ${c} 14%, #fff);color:${c}">media</span>
            <div class="card-head">
              ${avatarHtml(p0)}
              <span class="name">${esc(p0.author)}</span>
              <span class="time">${fmtTime(p0.occurredAt)}</span>
            </div>
            <div class="text">${textHtml}</div>
            <div class="media doclist">${links}</div>
          </div>
        </div>`;
    }

    function rowHtml(entry, i){
      if (entry.photoGroup) return photoGroupHtml(entry.photoGroup, i);
      if (entry.docGroup) return docGroupHtml(entry.docGroup, i);
      const p = entry;
      const c = (TYPES[p.type] || TYPES.info).color;
      const side = i % 2 ? "right" : "left";
      const avatar = avatarHtml(p);

      let media = "";
      if (p.media && p.media.contentUrl) {
        const url = `${API}${p.media.contentUrl}`;
        const ct = p.media.contentType || "";
        if (ct.startsWith("image/") || p.media.mediaType === "foto")
          media = `<div class="media"><a href="${url}" target="_blank" rel="noopener"><img loading="lazy" src="${url}" alt="${esc(p.media.fileName)}"></a></div>`;
        else if (ct.startsWith("video/"))
          media = `<div class="media"><video controls preload="none" src="${url}"></video></div>`;
        else if (ct.startsWith("audio/") || p.media.mediaType === "audio")
          media = `<div class="media"><audio controls preload="none" src="${url}"></audio></div>`;
        else
          media = `<div class="media"><a class="doc" href="${url}" target="_blank" rel="noopener">${ICONS.documento} ${esc(p.media.fileName)}</a></div>`;
      } else if (p.type === "media") {
        media = `<div class="media muted">media non scaricato</div>`;
      }

      return `
        <div class="row ${side}">
          <div class="badge" style="background:${c}">${iconFor(p)}</div>
          <div class="card">
            <span class="tag" style="background:color-mix(in srgb, ${c} 14%, #fff);color:${c}">${p.type}</span>
            <div class="card-head">
              ${avatar}
              <span class="name">${esc(p.author)}</span>
              <span class="time">${fmtTime(p.occurredAt)}</span>
            </div>
            <div class="text">${esc(p.text)}</div>
            ${media}
          </div>
        </div>`;
    }

    const romeDay = (iso) => new Date(iso).toLocaleDateString("sv-SE", { timeZone: "Europe/Rome" });
    const todayRome = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Rome" });

    const openDays = new Set();   // giorni (yyyy-MM-dd) attualmente espansi

    const visibleItems = () => filterType ? data.filter(p => p.type === filterType) : data;

    function groupByDay(items){
      const map = new Map();
      for (const p of items) {
        const d = romeDay(p.occurredAt);
        let arr = map.get(d);
        if (!arr) map.set(d, arr = []);
        arr.push(p);
      }
      return [...map.entries()].sort((a, b) => b[0].localeCompare(a[0]));   // giorno più recente in alto
    }

    function dayHtml(day, pts){
      const open = openDays.has(day);
      const mc = pts.filter(p => p.media).length;
      return `
        <section class="day${open ? " open" : ""}${day === todayRome() ? " today" : ""}" id="day-${day}">
          <div class="day-head" role="button" tabindex="0" data-day="${day}" aria-expanded="${open}">
            <span class="chev">▸</span>
            <span class="day-title">${fmtDay(day)}</span>
            <span class="day-count">${pts.length} punti${mc ? ` · ${mc} media` : ""}</span>
            <button class="day-dl" data-day="${day}" title="Scarica il verbale della giornata" aria-label="Scarica verbale">${ICONS.download}</button>
          </div>
          <div class="day-body">${open ? `<div class="rail">${groupMedia(pts).map(rowHtml).join("")}</div>` : ""}</div>
        </section>`;
    }

    function renderStats(){
      if (!data.length) { el("stats").innerHTML = ""; return; }
      const media = data.filter(p => p.media).length;
      const days = new Set(data.map(p => romeDay(p.occurredAt))).size;
      const card = (k, s, v) =>
        `<div class="stat"><div class="k">${k}</div><div class="s">${s}</div><div class="v">${v}</div></div>`;
      el("stats").innerHTML =
        card("Punti", "in archivio", data.length) +
        card("Media", "scaricati", media) +
        card("Giorni", "in agenda", days);
    }

    function render(){
      const items = visibleItems();
      const groups = groupByDay(items);

      if (!data.length) { el("timeline").innerHTML = `<div class="empty">Nessun punto.</div>`; return; }
      if (!groups.length) { el("timeline").innerHTML = `<div class="empty">Nessun punto "${filterType}".</div>`; return; }

      el("timeline").innerHTML = groups.map(([day, pts]) => dayHtml(day, pts)).join("");
    }

    function toggleDay(day, force){
      const sec = document.getElementById("day-" + day);
      if (!sec) return;
      const open = force === undefined ? !openDays.has(day) : force;
      if (open) openDays.add(day); else openDays.delete(day);
      sec.classList.toggle("open", open);
      sec.querySelector(".day-head").setAttribute("aria-expanded", open);
      const body = sec.querySelector(".day-body");
      if (open) {
        const pts = visibleItems().filter(p => romeDay(p.occurredAt) === day);
        body.innerHTML = `<div class="rail">${groupMedia(pts).map(rowHtml).join("")}</div>`;
      } else {
        body.innerHTML = "";
      }
    }

    function goToDay(day){
      const sec = document.getElementById("day-" + day);
      if (!sec) return;
      // Navigazione da date picker / frecce: apri SOLO il giorno scelto. Se restano
      // aperti giorni più recenti (che stanno sopra nel DOM) le loro immagini lazy si
      // caricano dopo il primo paint, allungano la pagina e lo scroll finisce in mezzo
      // a quel giorno invece che su quello scelto.
      for (const d of [...openDays]) if (d !== day) toggleDay(d, false);
      toggleDay(day, true);
      // dopo il paint delle nuove righe, così lo scroll punta alla posizione giusta;
      // l'offset per la topbar sticky è gestito da scroll-margin-top su .day
      requestAnimationFrame(() => sec.scrollIntoView({ behavior: "smooth", block: "start" }));
    }

    // --- vista Media: griglia per giorno, filtrabile per tipo di file ------
    let mediaFilter = null;   // null = tutte le categorie
    const MEDIA_KINDS = { foto: "Foto", video: "Video", documento: "Documenti" };

    // Stessa logica di isImage/isDoc sopra, unificata in una sola categoria per item.
    // I vocali non compaiono in questa vista (galleria foto/video/documenti, non messaggi audio).
    function mediaKind(p){
      if (!p.media || !p.media.contentUrl) return null;
      const ct = p.media.contentType || "";
      if (ct.startsWith("video/")) return "video";
      if (ct.startsWith("image/") || p.media.mediaType === "foto") return "foto";
      if (ct.startsWith("audio/") || p.media.mediaType === "audio") return null;
      return "documento";
    }

    // Anteprima reale della prima pagina per i PDF, via PDF.js caricato on-demand
    // (solo quando un tile PDF entra in viewport, non a ogni caricamento della vista).
    const PDFJS_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    let pdfjsReady = null;
    function ensurePdfJs(){
      if (pdfjsReady) return pdfjsReady;
      pdfjsReady = new Promise((resolve, reject) => {
        if (window.pdfjsLib) { resolve(window.pdfjsLib); return; }
        const s = document.createElement("script");
        s.src = PDFJS_BASE + "pdf.min.js";
        s.onload = () => {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.js";
          resolve(window.pdfjsLib);
        };
        s.onerror = () => reject(new Error("PDF.js non caricato"));
        document.head.appendChild(s);
      });
      return pdfjsReady;
    }

    async function renderPdfThumb(canvas){
      try {
        const pdfjsLib = await ensurePdfJs();
        const doc = await pdfjsLib.getDocument(canvas.dataset.pdfUrl).promise;
        const page = await doc.getPage(1);
        const scale = 240 / page.getViewport({ scale: 1 }).width;
        const viewport = page.getViewport({ scale });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
      } catch (e) {
        canvas.remove();   // resta visibile l'icona/didascalia già sotto, come fallback
      }
    }

    const pdfObserver = new IntersectionObserver((entries, obs) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        obs.unobserve(entry.target);
        renderPdfThumb(entry.target);
      }
    }, { rootMargin: "200px" });

    function observePdfTiles(){
      el("mediaGrid").querySelectorAll(".mpdf").forEach(c => pdfObserver.observe(c));
    }

    function fmtSize(b){
      if (b == null) return "";
      if (b < 1024) return `${b} B`;
      if (b < 1024 * 1024) return `${(b / 1024).toFixed(b < 10240 ? 1 : 0)} kB`;
      return `${(b / 1024 / 1024).toFixed(1)} MB`;
    }

    function buildMediaFilters(){
      const item = (k, label) =>
        `<button class="fitem" data-k="${k}" style="--c:var(--media)"><span class="dot"></span>${label}</button>`;
      el("mediaFilters").innerHTML =
        item("", "Tutti") + Object.entries(MEDIA_KINDS).map(([k, l]) => item(k, l)).join("");
      syncMediaChips();
    }

    function syncMediaChips(){
      for (const b of el("mediaFilters").children)
        b.classList.toggle("active", b.dataset.k === (mediaFilter || ""));
    }

    const mediaItems = () => data.filter(p => mediaKind(p));
    const visibleMediaItems = () => {
      const all = mediaItems();
      return mediaFilter ? all.filter(p => mediaKind(p) === mediaFilter) : all;
    };

    function tileHtml(p){
      const kind = mediaKind(p);
      const url = `${API}${p.media.contentUrl}`;
      const sizeBadge = p.media.sizeBytes != null ? `<span class="msize">${fmtSize(p.media.sizeBytes)}</span>` : "";
      const isPdf = kind === "documento" &&
        (p.media.contentType === "application/pdf" || /\.pdf$/i.test(p.media.fileName));
      let inner;
      if (kind === "foto") {
        inner = `<img loading="lazy" src="${url}" alt="${esc(p.media.fileName)}">`;
      } else if (kind === "video") {
        inner = `<video preload="metadata" muted playsinline src="${url}#t=0.1"></video>
          <div class="mplay"><span>${ICONS.play}</span></div>`;
      } else if (isPdf) {
        inner = `<div class="micon">${ICONS.documento}</div><canvas class="mpdf" data-pdf-url="${url}"></canvas>
          <div class="mcap">${esc(p.media.fileName)}</div>`;
      } else {
        inner = `<div class="micon">${ICONS[kind]}</div><div class="mcap">${esc(p.media.fileName)}</div>`;
      }
      return `<a class="mtile" href="${url}" target="_blank" rel="noopener" title="${esc(p.media.fileName)}">${inner}${sizeBadge}</a>`;
    }

    function mediaGroupHtml(day, pts){
      return `
        <section class="mgroup${day === todayRome() ? " today" : ""}">
          <div class="mgroup-head">
            <span class="mgroup-title">${fmtDay(day)}</span>
            <span class="mgroup-count">${pts.length} elementi</span>
          </div>
          <div class="mgrid">${pts.map(tileHtml).join("")}</div>
        </section>`;
    }

    function renderMedia(){
      const items = visibleMediaItems();
      const groups = groupByDay(items);
      if (!mediaItems().length) { el("mediaGrid").innerHTML = `<div class="empty">Nessun media.</div>`; return; }
      if (!groups.length) { el("mediaGrid").innerHTML = `<div class="empty">Nessun media in questa categoria.</div>`; return; }
      el("mediaGrid").innerHTML = groups.map(([day, pts]) => mediaGroupHtml(day, pts)).join("");
      observePdfTiles();
    }

    el("mediaFilters").onclick = (e) => {
      const b = e.target.closest(".fitem");
      if (!b) return;
      const k = b.dataset.k || null;
      mediaFilter = (k === mediaFilter) ? null : k;
      syncMediaChips();
      renderMedia();
    };

    async function load(){
      el("timeline").innerHTML = `<div class="loading">Carico…</div>`;
      try {
        const r = await fetch(`${API}/api/digestpoints`, { headers: authHeaders() });
        if (r.status === 401) { setToken(null); showLogin(); return; }
        if (!r.ok) { el("timeline").innerHTML = `<div class="error">Errore API: HTTP ${r.status}</div>`; return; }
        data = await r.json();
        renderStats();
        renderMedia();
      } catch (e) {
        el("timeline").innerHTML = `<div class="error">API non raggiungibile su <code>${API}</code>.<br>Avvia <code>ComitatoFeste.Api</code>.</div>`;
        return;
      }

      const days = groupByDay(data).map(([d]) => d);
      const wanted = el("day").value;
      const initial = days.includes(wanted) ? wanted : days[0];
      // Il date picker riflette il giorno effettivamente mostrato: se "oggi" non ha
      // ancora punti, si allinea al giorno più recente con dati (es. days[0]).
      if (initial) el("day").value = initial;
      openDays.clear();
      if (initial) openDays.add(initial);
      render();
      if (initial && qs.get("date")) requestAnimationFrame(() => goToDay(initial));
    }

    function shiftDay(n){
      const d = new Date(el("day").value + "T12:00:00");
      d.setDate(d.getDate() + n);
      el("day").value = d.toISOString().slice(0, 10);
      goToDay(el("day").value);
    }

    el("prev").onclick = () => shiftDay(-1);
    el("next").onclick = () => shiftDay(1);
    el("day").onchange = () => goToDay(el("day").value);
    el("timeline").onclick = (e) => {
      const dl = e.target.closest(".day-dl");
      if (dl) { downloadRecap(dl.dataset.day, dl); return; }
      const h = e.target.closest(".day-head");
      if (h) toggleDay(h.dataset.day);
    };
    el("timeline").onkeydown = (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const h = e.target.closest(".day-head");
      if (h && e.target === h) { e.preventDefault(); toggleDay(h.dataset.day); }
    };

    async function downloadRecap(day, btn){
      if (btn.classList.contains("busy")) return;
      btn.classList.add("busy");
      try {
        const r = await fetch(`${API}/api/digestpoints/recap?date=${day}`, { headers: authHeaders() });
        if (r.status === 401) { setToken(null); showLogin(); return; }
        if (!r.ok) {
          const msg = (await r.text()) || `HTTP ${r.status}`;
          alert(`Verbale non disponibile:\n${msg}`);
          return;
        }
        const blob = await r.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `verbale-${day}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(a.href);
      } catch (e) {
        alert(`Errore nel generare il verbale: ${e.message}`);
      } finally {
        btn.classList.remove("busy");
      }
    }
    el("filters").onclick = (e) => {
      const b = e.target.closest(".fitem");
      if (!b) return;
      const k = b.dataset.k || null;
      filterType = (k === filterType) ? null : k;   // "Tutti" o riclicca = mostra tutto
      syncChips();
      render();
    };

    // --- viste (menu sidebar) --------------------------------------------
    let view = "agenda";
    function setView(v){
      view = v;
      el("viewAgenda").hidden = v !== "agenda";
      el("viewMedia").hidden  = v !== "media";
      el("daynav").hidden     = v !== "agenda";
      el("viewTitle").textContent = v === "media" ? "Media" : "Agenda";
      document.title = "Comitato feste 87 — " + el("viewTitle").textContent;
      for (const b of el("nav").children) b.classList.toggle("active", b.dataset.view === v);
      scrollTo({ top: 0 });
    }
    el("nav").onclick = (e) => {
      const b = e.target.closest(".navitem");
      if (b) setView(b.dataset.view);
    };

    el("toTop").onclick = () => scrollTo({ top: 0, behavior: "smooth" });
    addEventListener("scroll", () => {
      el("toTop").classList.toggle("show", window.scrollY > 300);
    }, { passive: true });

    el("loginForm").onsubmit = async (e) => {
      e.preventDefault();
      const btn = el("lgBtn"), err = el("lgErr");
      err.hidden = true;
      btn.disabled = true;
      try {
        const r = await fetch(`${API}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: el("lgUser").value.trim(), password: el("lgPass").value }),
        });
        if (!r.ok) {
          err.textContent = r.status === 401 ? "Utente o password non validi." : `Errore: HTTP ${r.status}`;
          err.hidden = false;
          return;
        }
        const d = await r.json();
        setToken(d.token);
        setUser({ username: d.username, memberId: d.memberId, displayName: d.displayName });
        el("lgPass").value = "";
        hideLogin();
        load();
      } catch (_) {
        err.textContent = `API non raggiungibile su ${API}.`;
        err.hidden = false;
      } finally {
        btn.disabled = false;
      }
    };

    el("day").value = qs.get("date") || todayRome();
    buildFilters();
    buildMediaFilters();

    (async () => {
      let enabled = true;
      try {
        const r = await fetch(`${API}/api/auth/status`);
        if (r.ok) enabled = (await r.json()).enabled;
      } catch (_) { /* API giù: lascia provare a load() che mostrerà l'errore */ }

      if (enabled && !token) {
        showLogin();
      } else {
        if (enabled) hideLogin();   // mostra il bottone "esci"
        load();   // load() gestisce un 401 (token scaduto) mostrando il login
      }
    })();
  </script>
</body>
</html>
